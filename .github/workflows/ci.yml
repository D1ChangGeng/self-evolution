name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run check:bundle
      - run: npm run eval:engineering:test
      - run: python -m unittest discover -s maintainer/evals/public -p test_workspace_snapshot.py -v
      - run: npm run eval
      - name: Installed skill CLI smoke test
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          node skills/self-evolution/references/bin/kb.mjs init --project-root "$tmp"
          node skills/self-evolution/references/bin/kb.mjs check --project-root "$tmp"
